name: Deploy Backend to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: trip-me-buddy-backend
  ECS_CLUSTER: trip-me-buddy-cluster
  ECS_SERVICE: trip-me-buddy-backend-service
  TASK_FAMILY: trip-me-buddy-backend-task

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create task definition JSON
        run: |
          cat > task-definition.json <<EOF
          {
            "family": "${{ env.TASK_FAMILY }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::594585418788:role/trip-me-buddy-ecs-task-execution-role",
            "containerDefinitions": [
              {
                "name": "backend",
                "image": "${{ steps.build-image.outputs.image }}",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "protocol": "tcp"
                  }
                ],
                "environment": [
                  {
                    "name": "DB_HOST",
                    "value": "trip-me-buddy-postgres.ckjwwyiy4cm4.us-east-1.rds.amazonaws.com"
                  },
                  {
                    "name": "DB_PORT",
                    "value": "5432"
                  },
                  {
                    "name": "DB_NAME",
                    "value": "tripmebbuddy_v2"
                  },
                  {
                    "name": "REDIS_HOST",
                    "value": "trip-me-buddy-redis.qmxr2e.0001.use1.cache.amazonaws.com"
                  },
                  {
                    "name": "REDIS_PORT",
                    "value": "6379"
                  },
                  {
                    "name": "REDIS_DB",
                    "value": "0"
                  },
                  {
                    "name": "REDIS_PASSWORD",
                    "value": ""
                  },
                  {
                    "name": "KEYCLOAK_SERVER_URL",
                    "value": "http://trip-me-buddy-alb-990405631.us-east-1.elb.amazonaws.com"
                  },
                  {
                    "name": "KEYCLOAK_REALM",
                    "value": "tripmebuddy"
                  },
                  {
                    "name": "KEYCLOAK_CLIENT_ID",
                    "value": "trip-me-buddy-frontend"
                  },
                  {
                    "name": "KEYCLOAK_BACKEND_CLIENT_ID",
                    "value": "trip-me-buddy-backend"
                  },
                  {
                    "name": "KEYCLOAK_BACKEND_CLIENT_SECRET",
                    "value": "${{ secrets.KEYCLOAK_BACKEND_CLIENT_SECRET }}"
                  },
                  {
                    "name": "ALGORITHM",
                    "value": "RS256"
                  },
                  {
                    "name": "DEBUG",
                    "value": "False"
                  },
                  {
                    "name": "PROJECT_NAME",
                    "value": "Trip Me Buddy API"
                  },
                  {
                    "name": "VERSION",
                    "value": "1.0.0"
                  },
                  {
                    "name": "BACKEND_CORS_ORIGINS",
                    "value": "[\"http://localhost:5173\",\"http://localhost:3000\",\"https://tripmebuddy.senseddreams.com\",\"https://senseddreams.com\"]"
                  }
                ],
                "secrets": [
                  {
                    "name": "AMADEUS_API_KEY",
                    "valueFrom": "arn:aws:ssm:us-east-1:594585418788:parameter/trip-me-buddy/amadeus-api-key"
                  },
                  {
                    "name": "AMADEUS_API_SECRET",
                    "valueFrom": "arn:aws:ssm:us-east-1:594585418788:parameter/trip-me-buddy/amadeus-api-secret"
                  },
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": "arn:aws:ssm:us-east-1:594585418788:parameter/trip-me-buddy/db-password"
                  },
                  {
                    "name": "DB_USER",
                    "valueFrom": "arn:aws:ssm:us-east-1:594585418788:parameter/trip-me-buddy/db-user"
                  },
                  {
                    "name": "GEMINI_API_KEY",
                    "valueFrom": "arn:aws:ssm:us-east-1:594585418788:parameter/trip-me-buddy/gemini-api-key"
                  },
                  {
                    "name": "KEYCLOAK_CLIENT_SECRET",
                    "valueFrom": "arn:aws:ssm:us-east-1:594585418788:parameter/trip-me-buddy/keycloak-client-secret"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/trip-me-buddy",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "backend"
                  }
                },
                "healthCheck": {
                  "command": ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 60
                }
              }
            ]
          }
          EOF

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Update ECS service with new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
            --force-new-deployment
